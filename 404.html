<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#16a34a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Error - PPMI">
    <link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1RIT1Gm7ICdsZruNqS0EpEK2J3PIYws5E">

    <title>Halaman Tidak Ditemukan - PPMI Madinah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html, body { 
            overflow: hidden !important; 
            position: relative; 
            width: 100%; 
            height: 100dvh; 
            margin: 0; 
            padding: 0; 
            touch-action: manipulation; 
            background-color: #f8fafc; 
            font-family: 'Poppins', sans-serif;
        }
        * { box-sizing: border-box !important; -webkit-tap-highlight-color: transparent; }
        
        /* Animasi masuk */
        .animate-fade-in { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .animate-pulse-slow { animation: pulseSlow 3s infinite; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseSlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="w-full max-w-md mx-auto bg-gray-50 relative flex flex-col shadow-2xl justify-center items-center">

    <div class="flex-1 flex flex-col h-full w-full relative z-10 bg-gray-50 animate-fade-in items-center justify-center">

        <!-- Background Dekorasi Atas -->
        <div class="absolute top-0 left-0 w-full h-[20rem] bg-gradient-to-b from-green-700 to-green-600 rounded-b-[3rem] z-0 shadow-inner"></div>

        <!-- Area Konten -->
        <main class="relative z-20 flex flex-col items-center text-center px-6 animate-slide-up w-full mt-[-2rem]">
            
            <!-- Logo Error -->
            <div class="relative w-44 h-44 bg-white rounded-full flex items-center justify-center shadow-2xl p-6 border-4 border-red-500/30 mb-8 animate-pulse-slow">
                <img src="https://lh3.googleusercontent.com/d/1RIT1Gm7ICdsZruNqS0EpEK2J3PIYws5E=s1015?authuser=0" alt="Logo PPMI" class="w-full h-full object-contain drop-shadow-sm grayscale opacity-80">
                <!-- Icon Silang / Warning kecil -->
                <div class="absolute bottom-2 right-2 bg-red-500 text-white rounded-full w-10 h-10 flex items-center justify-center border-4 border-white shadow-lg">
                    <i class="fas fa-exclamation text-lg"></i>
                </div>
            </div>

            <!-- Teks Error -->
            <h1 class="text-5xl font-black text-gray-800 tracking-tighter mb-2">AFWAN....</h1>
            <h2 class="text-xl font-bold text-gray-800 mb-2">Halaman Bermasalah</h2>
            <p class="text-sm text-gray-500 mb-8 max-w-[250px] leading-relaxed">
                Halaman yang Anda tuju tidak ditemukan atau sedang dalam perbaikan.
            </p>

            <!-- Tombol Kembali -->
            <a href="index.html" id="btn-back" class="bg-green-600 text-white px-8 py-3.5 rounded-full font-semibold shadow-[0_8px_20px_rgba(22,163,74,0.3)] hover:bg-green-700 active:scale-95 transition-all flex items-center gap-3">
                <i class="fas fa-home"></i>
                <span>Kembali ke Beranda</span>
            </a>

            <!-- Countdown Teks -->
            <p class="text-xs text-gray-400 mt-6 font-medium">
                Otomatis dialihkan dalam <span id="countdown" class="font-bold text-green-600">5</span> detik...
            </p>

        </main>
    </div>

    <script>
        // Fitur Countdown untuk Auto-Redirect
        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                // Menambahkan efek tombol loading saat redirect
                const btn = document.getElementById('btn-back');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Mengalihkan...</span>';
                btn.classList.add('opacity-80', 'pointer-events-none');
                
                // Redirect ke index.html
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>
</html>

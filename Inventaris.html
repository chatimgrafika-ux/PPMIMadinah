<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Inventaris PPMI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Animasi dan Custom CSS */
        .fade-out { animation: fadeOut 0.5s ease-out forwards; }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #16a34a; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body { -webkit-tap-highlight-color: transparent; }
        /* Style scrollbar kecil untuk container checkbox */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- ================= SPLASH SCREEN ================= -->
    <div id="splash-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <img src="https://lh3.googleusercontent.com/d/1RIT1Gm7ICdsZruNqS0EpEK2J3PIYws5E=s1100?authuser=0" alt="Logo PPMI" class="w-48 h-auto mb-4 drop-shadow-md">
        <h1 class="text-2xl font-bold text-green-700 tracking-wide">INVENTARIS PPMI</h1>
        <div class="loader mt-6"></div>
    </div>

    <!-- ================= LOGIN SCREEN ================= -->
    <div id="login-screen" class="hidden h-full flex flex-col items-center justify-center p-6 bg-green-50">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm slide-in border-t-4 border-green-600">
            <div class="text-center mb-6">
                <img src="https://lh3.googleusercontent.com/d/1RIT1Gm7ICdsZruNqS0EpEK2J3PIYws5E=s1100?authuser=0" alt="Logo" class="w-20 mx-auto mb-2">
                <h2 class="text-xl font-bold text-gray-800">Masuk Akun</h2>
                <p class="text-sm text-gray-500">Gunakan email yang terdaftar</p>
            </div>

            <!-- Tahap 1: Input Email -->
            <div id="login-step-1">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Gmail</label>
                <div class="relative mb-4">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email-input" placeholder="contoh@gmail.com" class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition">
                </div>
                <button onclick="requestOTP()" id="btn-req-otp" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition flex justify-center items-center">
                    Minta Kode OTP
                </button>
            </div>

            <!-- Tahap 2: Input OTP -->
            <div id="login-step-2" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Kode OTP</label>
                <p class="text-xs text-green-600 mb-3">Kode telah dikirim ke <span id="display-email" class="font-bold"></span></p>
                <div class="relative mb-4">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fas fa-key"></i></span>
                    <input type="number" id="otp-input" placeholder="Masukkan 6 digit OTP" class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition text-center tracking-widest text-lg">
                </div>
                <button onclick="verifyOTP()" id="btn-verify-otp" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition flex justify-center items-center">
                    Verifikasi & Masuk
                </button>
                <button onclick="resetLogin()" class="w-full mt-3 text-sm text-gray-500 hover:text-green-600 transition">Ganti Email</button>
            </div>
        </div>
    </div>

    <!-- ================= MAIN APP ================= -->
    <div id="main-app" class="hidden h-full flex flex-col w-full max-w-md mx-auto bg-white shadow-xl relative">
        
        <!-- Header -->
        <header class="bg-green-600 text-white p-4 shadow-md flex justify-between items-center shrink-0 z-10">
            <div class="flex items-center gap-3">
                <img src="https://lh3.googleusercontent.com/d/1RIT1Gm7ICdsZruNqS0EpEK2J3PIYws5E=s1100?authuser=0" alt="Logo" class="w-8 h-8 bg-white rounded-full p-1">
                <h1 class="text-lg font-bold" id="header-title">Inventaris PPMI</h1>
            </div>
            <button onclick="logout()" class="text-green-100 hover:text-white transition"><i class="fas fa-sign-out-alt text-xl"></i></button>
        </header>

        <!-- Content Area -->
        <main id="content-area" class="flex-1 overflow-y-auto p-4 bg-gray-50 pb-20 scroll-smooth">
            
            <!-- View Peminjaman (Utuh) -->
            <div id="view-peminjaman" class="view-section slide-in">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-bold text-green-700 border-b pb-2 mb-4"><i class="fas fa-hand-holding-hand mr-2"></i>Form Peminjaman</h2>
                    <form id="form-peminjaman" onsubmit="submitPeminjaman(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Pilih Barang (Bisa lebih dari 1)</label>
                            <div id="pinjam-barang-container" class="w-full max-h-40 overflow-y-auto custom-scrollbar border rounded-lg bg-white shadow-inner focus-within:ring-2 focus-within:ring-green-500 space-y-0">
                                <!-- Checkbox Barang -->
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">Tgl & Waktu Pinjam</label>
                                <input type="datetime-local" id="pinjam-tgl" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 text-sm">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">Tgl & Waktu Kembali</label>
                                <input type="datetime-local" id="kembali-tgl" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Nama Peminjam</label>
                            <input type="text" id="pinjam-nama" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Penanggung Jawab</label>
                            <input type="text" id="pinjam-pj" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">No. WhatsApp</label>
                            <input type="tel" id="pinjam-wa" required placeholder="628... atau 9665..." oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Saksi (Opsional)</label>
                            <input type="text" id="pinjam-saksi" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                        </div>
                        <button type="submit" id="btn-submit-pinjam" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">Ajukan Peminjaman</button>
                    </form>
                </div>
            </div>

            <!-- View Kelola Barang (Utuh) -->
            <div id="view-kelola" class="view-section hidden slide-in">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">Daftar Barang</h2>
                    <button onclick="openFormBarang()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow hover:bg-green-700"><i class="fas fa-plus mr-1"></i> Tambah</button>
                </div>
                
                <div id="list-barang" class="space-y-3">
                    <!-- List barang -->
                </div>

                <div id="modal-barang" class="hidden bg-white p-5 rounded-xl shadow-lg border border-gray-200 mt-4">
                    <h3 id="modal-barang-title" class="font-bold text-green-700 mb-4 border-b pb-2">Tambah Barang Baru</h3>
                    <form id="form-barang" onsubmit="submitBarang(event)" class="space-y-3">
                        <input type="hidden" id="barang-id">
                        <input type="hidden" id="barang-foto-url">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Nama Barang</label>
                            <input type="text" id="barang-nama" required class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Kondisi</label>
                                <select id="barang-kondisi" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500">
                                    <option value="Baik">Baik</option>
                                    <option value="Rusak Ringan">Rusak Ringan</option>
                                    <option value="Rusak Berat">Rusak Berat</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Estimasi Harga (Rp)</label>
                                <input type="number" id="barang-harga" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Lokasi Penyimpanan</label>
                            <input type="text" id="barang-lokasi" required class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Upload Foto</label>
                            <input type="file" id="barang-foto" accept="image/*" class="w-full p-2 border rounded text-sm bg-gray-50">
                            <div id="preview-foto-container" class="mt-2 hidden">
                                <img id="preview-foto" src="" class="h-24 w-auto rounded border shadow-sm">
                            </div>
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button type="button" onclick="closeFormBarang()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded font-semibold">Batal</button>
                            <button type="submit" id="btn-submit-barang" class="flex-1 bg-green-600 text-white py-2 rounded font-semibold">Simpan</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- View Obat (BARU) -->
            <div id="view-obat" class="view-section hidden slide-in">
                <!-- Navigasi Internal Obat -->
                <div class="flex border-b mb-4">
                    <button onclick="switchObatTab('form')" id="tab-obat-form" class="flex-1 py-3 text-sm font-bold text-green-600 border-b-2 border-green-600 transition">Ambil Obat</button>
                    <button onclick="switchObatTab('data')" id="tab-obat-data" class="flex-1 py-3 text-sm font-bold text-gray-400 border-b-2 border-transparent transition">Persediaan</button>
                    <button onclick="switchObatTab('histori')" id="tab-obat-histori" class="flex-1 py-3 text-sm font-bold text-gray-400 border-b-2 border-transparent transition">Riwayat</button>
                </div>

                <!-- 1. Tab Form Pengajuan Obat -->
                <div id="obat-tab-form" class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <form id="form-ambil-obat" onsubmit="submitAmbilObat(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Pilih Obat (Dari Stok)</label>
                            <select id="ambil-obat-kode" onchange="updateSatuanObat()" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                                <!-- Option Obat -->
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">Jumlah Diambil</label>
                                <input type="number" id="ambil-obat-jumlah" min="1" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">Satuan</label>
                                <input type="text" id="ambil-obat-satuan" disabled class="w-full p-2.5 border bg-gray-100 rounded-lg text-gray-500 font-semibold">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Nama Pengambil</label>
                            <input type="text" id="ambil-obat-nama" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Asal Kampus</label>
                            <input type="text" id="ambil-obat-kampus" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Keluhan / Keperluan</label>
                            <textarea id="ambil-obat-keluhan" required rows="2" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500"></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">Petugas (Opsional)</label>
                                <input type="text" id="ambil-obat-petugas" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">Keterangan</label>
                                <input type="text" id="ambil-obat-ket" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                            </div>
                        </div>
                        <button type="submit" id="btn-submit-ambil-obat" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">Ajukan Pengambilan</button>
                    </form>
                </div>

                <!-- 2. Tab Persediaan / Kelola Obat -->
                <div id="obat-tab-data" class="hidden">
                    <button onclick="openFormMed()" class="mb-4 bg-green-600 text-white px-4 py-3 rounded-lg text-sm font-semibold shadow w-full hover:bg-green-700 transition"><i class="fas fa-plus-circle mr-2"></i> Tambah Data Obat Baru</button>
                    
                    <div id="list-obat" class="space-y-3">
                        <!-- List Persediaan Obat -->
                    </div>

                    <!-- Modal Tambah/Edit Obat -->
                    <div id="modal-obat" class="hidden bg-white p-5 rounded-xl shadow-lg border border-gray-200 mt-4">
                        <h3 id="modal-obat-title" class="font-bold text-green-700 mb-4 border-b pb-2">Tambah Data Obat</h3>
                        <form id="form-obat" onsubmit="submitMed(event)" class="space-y-3">
                            <input type="hidden" id="med-old-kode">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Kode Obat</label>
                                    <input type="text" id="med-kode" required class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Nama Obat</label>
                                    <input type="text" id="med-nama" required class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500">
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-3">
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Kategori</label>
                                    <input type="text" id="med-kategori" placeholder="Bebas/Resep" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Bentuk</label>
                                    <input type="text" id="med-bentuk" placeholder="Tablet/Sirup" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Satuan</label>
                                    <input type="text" id="med-satuan" required placeholder="Strip/Botol" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500 text-sm">
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-3 bg-gray-50 p-2 rounded border">
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-500 mb-1">Stok Awal</label>
                                    <input type="number" id="med-stok-awal" required class="w-full p-1 border rounded focus:ring-1 focus:ring-green-500 text-sm">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-blue-600 mb-1">Stok Saat Ini</label>
                                    <input type="number" id="med-stok-saat-ini" required class="w-full p-1 border rounded focus:ring-1 focus:ring-blue-500 text-sm font-bold text-blue-700">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-red-500 mb-1">Stok Min</label>
                                    <input type="number" id="med-stok-min" required class="w-full p-1 border rounded focus:ring-1 focus:ring-red-500 text-sm">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Tgl Kedaluwarsa</label>
                                    <input type="date" id="med-tgl-exp" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Lokasi Penyimpanan</label>
                                    <input type="text" id="med-lokasi" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Keterangan Tambahan</label>
                                <input type="text" id="med-ket" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500">
                            </div>
                            <div class="flex gap-2 pt-2">
                                <button type="button" onclick="closeFormMed()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded font-semibold">Batal</button>
                                <button type="submit" id="btn-submit-med" class="flex-1 bg-green-600 text-white py-2 rounded font-semibold">Simpan Data</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 3. Tab Histori Obat -->
                <div id="obat-tab-histori" class="hidden">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3"><i class="fas fa-search text-gray-400"></i></div>
                        <input type="text" id="search-histori-obat" onkeyup="renderMedHistory()" placeholder="Cari nama pengambil / obat..." class="w-full pl-10 pr-3 py-2 border rounded-lg mb-4 focus:ring-2 focus:ring-green-500 text-sm">
                    </div>
                    <div id="list-histori-obat" class="space-y-3">
                        <!-- Histori Obat -->
                    </div>
                </div>
            </div>

            <!-- View Histori (Pinjam Barang) Utuh -->
            <div id="view-histori" class="view-section hidden slide-in">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Histori Peminjaman</h2>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fas fa-search text-gray-400"></i>
                    </div>
                    <input type="text" id="search-histori" onkeyup="renderHistory()" placeholder="Cari peminjam / barang..." class="w-full pl-10 pr-3 py-2 border rounded-lg mb-4 focus:ring-2 focus:ring-green-500">
                </div>
                <div id="list-histori" class="space-y-3">
                    <!-- Histori dirender disini -->
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-200 flex justify-around items-center h-16 shrink-0 z-10 absolute bottom-0 w-full shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
            <!-- Tab 1: Peminjaman -->
            <button onclick="switchView('peminjaman')" id="nav-peminjaman" class="nav-btn flex flex-col items-center justify-center w-full h-full text-green-600 transition">
                <i class="fas fa-hand-holding-hand text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Peminjaman</span>
            </button>
            <!-- Tab 2: Barang -->
            <button onclick="switchView('kelola')" id="nav-kelola" class="nav-btn flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-green-500 transition">
                <i class="fas fa-box text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Barang</span>
            </button>
            <!-- Tab 3 (BARU): Obat -->
            <button onclick="switchView('obat')" id="nav-obat" class="nav-btn flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-green-500 transition relative">
                <i class="fas fa-notes-medical text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Obat</span>
                <span class="absolute top-1 right-3 flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span></span>
            </button>
            <!-- Tab 4: Histori -->
            <button onclick="switchView('histori')" id="nav-histori" class="nav-btn flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-green-500 transition">
                <i class="fas fa-history text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Histori</span>
            </button>
        </nav>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // MASUKKAN URL DEPLOY APPS SCRIPT ANDA DISINI (Akhiran /exec)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2ao0QcJlP7MwsZERwoQC14SHIFE7bKoreKPGjBWhFiDnS6P85-EEAsX4DlBE4VQq9aA/exec"; 
        
        let globalItems = [];
        let globalHistory = [];
        let tempBase64Image = "";

        // Global Obat
        let globalMeds = [];
        let globalMedHistory = [];

        // ----- INIT & SPLASH SCREEN -----
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('fade-out');
                setTimeout(() => {
                    document.getElementById('splash-screen').classList.add('hidden');
                    checkAuth();
                }, 500);
            }, 2000);
        };

        // ----- AUTHENTICATION -----
        function checkAuth() {
            const userEmail = localStorage.getItem('ppmi_email');
            if (userEmail) {
                showMainApp();
            } else {

        async function callAPI(action, payload = {}) {
            const formData = new URLSearchParams();
            formData.append("data", JSON.stringify({ action, ...payload }));
            
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: formData,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            });
            return await response.json();
        }

        document.getElementById('barang-foto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    tempBase64Image = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('preview-foto').src = tempBase64Image;
                    document.getElementById('preview-foto-container').classList.remove('hidden');
                }
            };
        });

        function maskString(str) {
            if(!str) return "";
            let s = str.toString();
            if(s.length <= 2) return s + "***";
            return s.substring(0, 2) + "***"; // Tampilkan 2 huruf awal saja
        }

        function maskEmail(email) {
            if(!email) return "";
            let e = email.toString();
            let parts = e.split('@');
            if(parts.length < 2) return maskString(e);
            return maskString(parts[0]) + "@" + parts[1]; // misal bu***@gmail.com
        }

        function renderMedHistory() {
            const keyword = document.getElementById('search-histori-obat').value.toLowerCase();
            const list = document.getElementById('list-histori-obat');
            list.innerHTML = '';
            
            const filtered = globalMedHistory.filter(h => 
                h.namaObat.toLowerCase().includes(keyword) || 
                h.namaPengambil.toLowerCase().includes(keyword)
            );

            if(filtered.length === 0) {
                list.innerHTML = '<p class="text-center text-sm text-gray-500 py-4">Belum ada riwayat pengambilan.</p>';
                return;
            }

            filtered.forEach(item => {
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-xl border shadow-sm relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                        <div class="flex justify-between items-start mb-1">
                            <h4 class="font-bold text-gray-800 text-sm leading-tight">${item.namaObat}</h4>
                            <span class="text-[10px] font-bold bg-blue-100 text-blue-700 px-2 py-0.5 rounded shadow-sm shrink-0 ml-2">
                                - ${item.jumlah} ${item.satuan}
                            </span>
                        </div>
                        <div class="flex items-center text-xs text-gray-600 mb-1">
                            <i class="fas fa-user-circle mr-1 text-gray-400"></i> ${maskString(item.namaPengambil)} 
                            <span class="text-[10px] text-gray-400 ml-1">(${maskEmail(item.email)})</span>
                        </div>
                        <div class="text-[10px] text-gray-500 mb-2">
                            <i class="fas fa-building mr-1"></i> ${item.kampus} | <i class="fas fa-user-md mr-1"></i> ${item.petugas || 'Mandiri'}
                        </div>
                        <div class="grid grid-cols-1 gap-1 text-xs bg-gray-50 p-2 rounded">
                            <div class="flex justify-between items-center"><span class="text-gray-400 text-[10px]">Waktu Pengambilan</span><span class="font-medium">${item.tanggal}</span></div>
                            <div><span class="text-gray-400 block text-[10px] mt-1">Keluhan / Catatan</span>${item.keluhan}</div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>

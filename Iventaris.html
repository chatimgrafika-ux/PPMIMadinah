<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Inventaris PPMI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Animasi dan Custom CSS */
        .fade-out { animation: fadeOut 0.5s ease-out forwards; }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #16a34a; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body { -webkit-tap-highlight-color: transparent; }
        /* Style scrollbar kecil untuk container checkbox */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- ================= SPLASH SCREEN ================= -->
    <div id="splash-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <img src="https://lh3.googleusercontent.com/d/1RIT1Gm7ICdsZruNqS0EpEK2J3PIYws5E=s1100?authuser=0" alt="Logo PPMI" class="w-48 h-auto mb-4 drop-shadow-md">
        <h1 class="text-2xl font-bold text-green-700 tracking-wide">INVENTARIS PPMI</h1>
        <div class="loader mt-6"></div>
    </div>

    <!-- ================= LOGIN SCREEN ================= -->
    <div id="login-screen" class="hidden h-full flex flex-col items-center justify-center p-6 bg-green-50">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm slide-in border-t-4 border-green-600">
            <div class="text-center mb-6">
                <img src="https://lh3.googleusercontent.com/d/1RIT1Gm7ICdsZruNqS0EpEK2J3PIYws5E=s1100?authuser=0" alt="Logo" class="w-20 mx-auto mb-2">
                <h2 class="text-xl font-bold text-gray-800">Masuk Akun</h2>
                <p class="text-sm text-gray-500">Gunakan email yang terdaftar</p>
            </div>

            <!-- Tahap 1: Input Email -->
            <div id="login-step-1">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Gmail</label>
                <div class="relative mb-4">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email-input" placeholder="contoh@gmail.com" class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition">
                </div>
                <button onclick="requestOTP()" id="btn-req-otp" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition flex justify-center items-center">
                    Minta Kode OTP
                </button>
            </div>

            <!-- Tahap 2: Input OTP -->
            <div id="login-step-2" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Kode OTP</label>
                <p class="text-xs text-green-600 mb-3">Kode telah dikirim ke <span id="display-email" class="font-bold"></span></p>
                <div class="relative mb-4">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fas fa-key"></i></span>
                    <input type="number" id="otp-input" placeholder="Masukkan 6 digit OTP" class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition text-center tracking-widest text-lg">
                </div>
                <button onclick="verifyOTP()" id="btn-verify-otp" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition flex justify-center items-center">
                    Verifikasi & Masuk
                </button>
                <button onclick="resetLogin()" class="w-full mt-3 text-sm text-gray-500 hover:text-green-600 transition">Ganti Email</button>
            </div>
        </div>
    </div>

    <!-- ================= MAIN APP ================= -->
    <div id="main-app" class="hidden h-full flex flex-col w-full max-w-md mx-auto bg-white shadow-xl relative">
        
        <!-- Header -->
        <header class="bg-green-600 text-white p-4 shadow-md flex justify-between items-center shrink-0 z-10">
            <div class="flex items-center gap-3">
                <img src="https://lh3.googleusercontent.com/d/1RIT1Gm7ICdsZruNqS0EpEK2J3PIYws5E=s1100?authuser=0" alt="Logo" class="w-8 h-8 bg-white rounded-full p-1">
                <h1 class="text-lg font-bold" id="header-title">Inventaris PPMI</h1>
            </div>
            <button onclick="logout()" class="text-green-100 hover:text-white transition"><i class="fas fa-sign-out-alt text-xl"></i></button>
        </header>

        <!-- Content Area -->
        <main id="content-area" class="flex-1 overflow-y-auto p-4 bg-gray-50 pb-20 scroll-smooth">
            <!-- View Peminjaman -->
            <div id="view-peminjaman" class="view-section slide-in">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-bold text-green-700 border-b pb-2 mb-4"><i class="fas fa-hand-holding-hand mr-2"></i>Form Peminjaman</h2>
                    <form id="form-peminjaman" onsubmit="submitPeminjaman(event)" class="space-y-4">
                        
                        <!-- REVISI 1: PEMILIHAN BEBERAPA BARANG -->
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Pilih Barang (Bisa lebih dari 1)</label>
                            <div id="pinjam-barang-container" class="w-full max-h-40 overflow-y-auto custom-scrollbar border rounded-lg bg-white shadow-inner focus-within:ring-2 focus-within:ring-green-500 space-y-0">
                                <!-- Checkbox Barang akan dirender disini -->
                            </div>
                        </div>

                        <!-- REVISI 4: KOLOM TANGGAL DAN WAKTU -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">Tgl & Waktu Pinjam</label>
                                <input type="datetime-local" id="pinjam-tgl" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 text-sm">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">Tgl & Waktu Kembali</label>
                                <input type="datetime-local" id="kembali-tgl" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500 text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Nama Peminjam</label>
                            <input type="text" id="pinjam-nama" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Penanggung Jawab</label>
                            <input type="text" id="pinjam-pj" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                        </div>
                        
                        <!-- REVISI 2: WA WAJIB ANGKA -->
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">No. WhatsApp</label>
                            <input type="tel" id="pinjam-wa" required placeholder="628... atau 9665..." oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Saksi (Opsional)</label>
                            <input type="text" id="pinjam-saksi" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-green-500">
                        </div>
                        <button type="submit" id="btn-submit-pinjam" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">Ajukan Peminjaman</button>
                    </form>
                </div>
            </div>

            <!-- View Kelola Barang -->
            <div id="view-kelola" class="view-section hidden slide-in">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">Daftar Barang</h2>
                    <button onclick="openFormBarang()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow hover:bg-green-700"><i class="fas fa-plus mr-1"></i> Tambah</button>
                </div>
                
                <div id="list-barang" class="space-y-3">
                    <!-- List barang akan dirender disini -->
                </div>

                <!-- Form Tambah/Edit Barang (Modal-like) -->
                <div id="modal-barang" class="hidden bg-white p-5 rounded-xl shadow-lg border border-gray-200 mt-4">
                    <h3 id="modal-barang-title" class="font-bold text-green-700 mb-4 border-b pb-2">Tambah Barang Baru</h3>
                    <form id="form-barang" onsubmit="submitBarang(event)" class="space-y-3">
                        <input type="hidden" id="barang-id">
                        <input type="hidden" id="barang-foto-url">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Nama Barang</label>
                            <input type="text" id="barang-nama" required class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Kondisi</label>
                                <select id="barang-kondisi" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500">
                                    <option value="Baik">Baik</option>
                                    <option value="Rusak Ringan">Rusak Ringan</option>
                                    <option value="Rusak Berat">Rusak Berat</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Estimasi Harga (Rp)</label>
                                <input type="number" id="barang-harga" class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Lokasi Penyimpanan</label>
                            <input type="text" id="barang-lokasi" required class="w-full p-2 border rounded focus:ring-1 focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Upload Foto</label>
                            <input type="file" id="barang-foto" accept="image/*" class="w-full p-2 border rounded text-sm bg-gray-50">
                            <div id="preview-foto-container" class="mt-2 hidden">
                                <img id="preview-foto" src="" class="h-24 w-auto rounded border shadow-sm">
                            </div>
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button type="button" onclick="closeFormBarang()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded font-semibold">Batal</button>
                            <button type="submit" id="btn-submit-barang" class="flex-1 bg-green-600 text-white py-2 rounded font-semibold">Simpan</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- View Histori -->
            <div id="view-histori" class="view-section hidden slide-in">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Histori Peminjaman</h2>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fas fa-search text-gray-400"></i>
                    </div>
                    <input type="text" id="search-histori" onkeyup="renderHistory()" placeholder="Cari peminjam / barang..." class="w-full pl-10 pr-3 py-2 border rounded-lg mb-4 focus:ring-2 focus:ring-green-500">
                </div>
                <div id="list-histori" class="space-y-3">
                    <!-- Histori dirender disini -->
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-200 flex justify-around items-center h-16 shrink-0 z-10 absolute bottom-0 w-full shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
            <button onclick="switchView('peminjaman')" id="nav-peminjaman" class="nav-btn flex flex-col items-center justify-center w-full h-full text-green-600">
                <i class="fas fa-hand-holding-hand text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Peminjaman</span>
            </button>
            <button onclick="switchView('kelola')" id="nav-kelola" class="nav-btn flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-green-500">
                <i class="fas fa-box text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Barang</span>
            </button>
            <button onclick="switchView('histori')" id="nav-histori" class="nav-btn flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-green-500">
                <i class="fas fa-history text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Histori</span>
            </button>
        </nav>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // MASUKKAN URL DEPLOY APPS SCRIPT ANDA DISINI (Akhiran /exec)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2ao0QcJlP7MwsZERwoQC14SHIFE7bKoreKPGjBWhFiDnS6P85-EEAsX4DlBE4VQq9aA/exec"; 
        
        let globalItems = [];
        let globalHistory = [];
        let tempBase64Image = "";

        // ----- INIT & SPLASH SCREEN -----
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('fade-out');
                setTimeout(() => {
                    document.getElementById('splash-screen').classList.add('hidden');
                    checkAuth();
                }, 500);
            }, 2000);
        };

        // ----- AUTHENTICATION -----
        function checkAuth() {
            const userEmail = localStorage.getItem('ppmi_email');
            if (userEmail) {
                showMainApp();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
            }
        }

        async function requestOTP() {
            const email = document.getElementById('email-input').value.trim();
            if(!email) return Swal.fire('Error', 'Masukkan email valid!', 'error');

            const btn = document.getElementById('btn-req-otp');
            btn.innerHTML = '<div class="loader"></div>';
            btn.disabled = true;

            try {
                const res = await callAPI('requestOTP', { email });
                if(res.success) {
                    document.getElementById('login-step-1').classList.add('hidden');
                    document.getElementById('login-step-2').classList.remove('hidden');
                    document.getElementById('display-email').innerText = email;
                    Swal.fire('Terkirim!', 'Cek inbox/spam Gmail Anda untuk kode OTP.', 'success');
                } else {
                    Swal.fire('Gagal', res.message, 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Terjadi kesalahan jaringan.', 'error');
            } finally {
                btn.innerHTML = 'Minta Kode OTP';
                btn.disabled = false;
            }
        }

        async function verifyOTP() {
            const email = document.getElementById('email-input').value.trim();
            const otp = document.getElementById('otp-input').value.trim();
            if(!otp) return Swal.fire('Error', 'Masukkan OTP!', 'error');

            const btn = document.getElementById('btn-verify-otp');
            btn.innerHTML = '<div class="loader"></div>';
            btn.disabled = true;

            try {
                const res = await callAPI('verifyOTP', { email, otp });
                if(res.success) {
                    localStorage.setItem('ppmi_email', email);
                    document.getElementById('login-screen').classList.add('hidden');
                    showMainApp();
                } else {
                    Swal.fire('Gagal', res.message, 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Terjadi kesalahan jaringan.', 'error');
            } finally {
                btn.innerHTML = 'Verifikasi & Masuk';
                btn.disabled = false;
            }
        }

        function resetLogin() {
            document.getElementById('login-step-2').classList.add('hidden');
            document.getElementById('login-step-1').classList.remove('hidden');
            document.getElementById('otp-input').value = "";
        }

        function logout() {
            Swal.fire({
                title: 'Keluar?', text: "Anda harus login dengan OTP lagi.", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#16a34a', cancelButtonColor: '#d33', confirmButtonText: 'Ya, Keluar'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem('ppmi_email');
                    window.location.reload();
                }
            })
        }

        // ----- NAVIGATION -----
        function showMainApp() {
            document.getElementById('main-app').classList.remove('hidden');
            loadItems();
        }

        function switchView(viewName) {
            // Hide all views
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${viewName}`).classList.remove('hidden');
            
            // Update Nav Styles
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-green-600');
                el.classList.add('text-gray-400');
            });
            document.getElementById(`nav-${viewName}`).classList.remove('text-gray-400');
            document.getElementById(`nav-${viewName}`).classList.add('text-green-600');

            // Header title & Data reload
            const titleMap = { peminjaman: 'Form Peminjaman', kelola: 'Kelola Barang', histori: 'Histori' };
            document.getElementById('header-title').innerText = titleMap[viewName];

            if(viewName === 'kelola') loadItems();
            if(viewName === 'histori') loadHistory();
        }

        // ----- DATA FETCHING & RENDERING -----
        async function callAPI(action, payload = {}) {
            const formData = new URLSearchParams();
            formData.append("data", JSON.stringify({ action, ...payload }));
            
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: formData,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            });
            return await response.json();
        }

        async function loadItems() {
            try {
                const res = await callAPI('getItems');
                if(res.success) {
                    globalItems = res.data;
                    renderSelectBarang();
                    renderListBarang();
                }
            } catch(e) { console.error(e); }
        }

        async function loadHistory() {
            try {
                const res = await callAPI('getHistory');
                if(res.success) {
                    globalHistory = res.data;
                    renderHistory();
                }
            } catch(e) { console.error(e); }
        }

        function renderSelectBarang() {
            const container = document.getElementById('pinjam-barang-container');
            container.innerHTML = '';
            
            if(globalItems.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-500 p-3 text-center">Belum ada barang.</p>';
                return;
            }

            globalItems.forEach(item => {
                container.innerHTML += `
                    <label class="flex items-center space-x-3 p-3 hover:bg-green-50 cursor-pointer border-b border-gray-100 last:border-0 transition">
                        <input type="checkbox" name="pinjam_barang_check" value="${item.namaBarang}" class="w-4 h-4 text-green-600 border-gray-300 rounded focus:ring-green-500 accent-green-600">
                        <span class="text-sm text-gray-700 font-medium">${item.namaBarang} <span class="text-[10px] font-normal text-gray-400">(${item.kondisi})</span></span>
                    </label>
                `;
            });
        }

        function renderListBarang() {
            const list = document.getElementById('list-barang');
            list.innerHTML = '';
            if(globalItems.length === 0) {
                list.innerHTML = '<p class="text-center text-sm text-gray-500 py-4">Belum ada barang.</p>';
                return;
            }
            
            globalItems.forEach(item => {
                const colorBadge = item.kondisi === 'Baik' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
                const imgTag = item.foto ? `<img src="${item.foto}" class="w-16 h-16 object-cover rounded-lg mr-3 shadow-sm">` : `<div class="w-16 h-16 bg-gray-200 rounded-lg mr-3 flex items-center justify-center text-gray-400"><i class="fas fa-image"></i></div>`;
                
                list.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border shadow-sm flex items-center">
                        ${imgTag}
                        <div class="flex-1">
                            <h4 class="font-bold text-gray-800 text-sm">${item.namaBarang}</h4>
                            <p class="text-xs text-gray-500 mb-1"><i class="fas fa-map-marker-alt text-red-400 mr-1"></i>${item.lokasi}</p>
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${colorBadge}">${item.kondisi}</span>
                        </div>
                        <button onclick='editBarang(${JSON.stringify(item)})' class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center hover:bg-blue-100"><i class="fas fa-pen text-xs"></i></button>
                    </div>
                `;
            });
        }

        // Format tanggal DateTime agar rapi tanpa timezone shift di frontend
        const formatUI_DateTime = (str) => {
            if(!str) return '-';
            if(!str.includes('T')) return new Date(str).toLocaleDateString('id-ID'); // fallback
            const [d, t] = str.split('T');
            return `${d.split('-').reverse().join('/')} | ${t} (KSA)`;
        };

        function renderHistory() {
            const keyword = document.getElementById('search-histori').value.toLowerCase();
            const list = document.getElementById('list-histori');
            list.innerHTML = '';
            
            const filtered = globalHistory.filter(h => 
                h.namaBarang.toLowerCase().includes(keyword) || 
                h.namaPeminjam.toLowerCase().includes(keyword)
            );

            if(filtered.length === 0) {
                list.innerHTML = '<p class="text-center text-sm text-gray-500 py-4">Data tidak ditemukan.</p>';
                return;
            }

            filtered.forEach(item => {
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-xl border shadow-sm relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-green-500"></div>
                        <h4 class="font-bold text-gray-800 text-sm mb-1 leading-tight">${item.namaBarang}</h4>
                        <div class="flex items-center text-xs text-gray-600 mb-2">
                            <i class="fas fa-user-circle mr-1 text-gray-400"></i> ${item.namaPeminjam}
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs bg-gray-50 p-2 rounded">
                            <div><span class="text-gray-400 block text-[10px]">Tgl Pinjam</span>${formatUI_DateTime(item.tglPinjam)}</div>
                            <div><span class="text-gray-400 block text-[10px]">Tgl Kembali</span>${formatUI_DateTime(item.tglKembali)}</div>
                        </div>
                        <a href="https://wa.me/${item.whatsapp.toString().replace(/^0/,'62')}" target="_blank" class="mt-2 inline-flex items-center text-[11px] text-green-600 hover:underline">
                            <i class="fab fa-whatsapp mr-1 text-sm"></i> Hubungi WA
                        </a>
                    </div>
                `;
            });
        }

        // ----- FORM BARANG LOGIC -----
        function openFormBarang() {
            document.getElementById('form-barang').reset();
            document.getElementById('barang-id').value = "";
            document.getElementById('barang-foto-url').value = "";
            document.getElementById('modal-barang-title').innerText = "Tambah Barang Baru";
            document.getElementById('preview-foto-container').classList.add('hidden');
            tempBase64Image = "";
            
            document.getElementById('list-barang').classList.add('hidden');
            document.getElementById('modal-barang').classList.remove('hidden');
        }

        function closeFormBarang() {
            document.getElementById('list-barang').classList.remove('hidden');
            document.getElementById('modal-barang').classList.add('hidden');
        }

        function editBarang(item) {
            openFormBarang();
            document.getElementById('modal-barang-title').innerText = "Edit Barang";
            document.getElementById('barang-id').value = item.id;
            document.getElementById('barang-nama').value = item.namaBarang;
            document.getElementById('barang-kondisi').value = item.kondisi;
            document.getElementById('barang-harga').value = item.harga;
            document.getElementById('barang-lokasi').value = item.lokasi;
            document.getElementById('barang-foto-url').value = item.foto;
            
            if(item.foto) {
                document.getElementById('preview-foto').src = item.foto;
                document.getElementById('preview-foto-container').classList.remove('hidden');
            }
        }

        // Image compression before upload
        document.getElementById('barang-foto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    tempBase64Image = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('preview-foto').src = tempBase64Image;
                    document.getElementById('preview-foto-container').classList.remove('hidden');
                }
            };
        });

        async function submitBarang(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-barang');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            const payload = {
                id: document.getElementById('barang-id').value,
                namaBarang: document.getElementById('barang-nama').value,
                kondisi: document.getElementById('barang-kondisi').value,
                harga: document.getElementById('barang-harga').value,
                lokasi: document.getElementById('barang-lokasi').value,
                fotoUrl: document.getElementById('barang-foto-url').value,
                fotoBase64: tempBase64Image
            };

            try {
                const res = await callAPI('saveItem', { item: payload });
                if(res.success) {
                    Swal.fire('Berhasil!', res.message, 'success');
                    closeFormBarang();
                    loadItems(); // refresh data
                } else {
                    Swal.fire('Gagal', res.message, 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Terjadi kesalahan jaringan', 'error');
            } finally {
                btn.innerHTML = 'Simpan';
                btn.disabled = false;
            }
        }

        // ----- FORM PEMINJAMAN LOGIC -----
        async function submitPeminjaman(e) {
            e.preventDefault();
            
            // VALIDASI WA
            const waVal = document.getElementById('pinjam-wa').value;
            if (!/^(628|9665)[0-9]+$/.test(waVal)) {
                return Swal.fire('Format Salah!', 'No. WhatsApp harus berupa angka dan wajib diawali dengan awalan kode 628 (Indonesia) atau 9665 (Arab Saudi).', 'error');
            }

            // VALIDASI PILIHAN BARANG
            const checkboxes = document.querySelectorAll('input[name="pinjam_barang_check"]:checked');
            if(checkboxes.length === 0) {
                return Swal.fire('Perhatian!', 'Mohon pilih minimal 1 barang yang ingin dipinjam!', 'warning');
            }
            const selectedBarang = Array.from(checkboxes).map(cb => cb.value).join(', ');

            // VALIDASI TANGGAL/WAKTU
            const tglPinjam = document.getElementById('pinjam-tgl').value;
            const tglKembali = document.getElementById('kembali-tgl').value;
            if (new Date(tglPinjam).getTime() >= new Date(tglKembali).getTime()) {
                return Swal.fire('Waktu Tidak Valid!', 'Waktu pengembalian barang harus setelah waktu peminjaman!', 'error');
            }

            const btn = document.getElementById('btn-submit-pinjam');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Proses...';
            btn.disabled = true;

            const payload = {
                email: localStorage.getItem('ppmi_email'), 
                namaBarang: selectedBarang,
                tglPinjam: tglPinjam,
                tglKembali: tglKembali,
                namaPeminjam: document.getElementById('pinjam-nama').value,
                penanggungJawab: document.getElementById('pinjam-pj').value,
                whatsapp: waVal,
                saksi: document.getElementById('pinjam-saksi').value
            };

            try {
                const res = await callAPI('borrowItem', { borrowData: payload });
                if(res.success) {
                    Swal.fire({
                        title: 'Berhasil!',
                        text: 'Peminjaman dicatat & Bukti dikirim ke email!',
                        icon: 'success',
                        confirmButtonColor: '#16a34a'
                    });
                    document.getElementById('form-peminjaman').reset();
                } else {
                    Swal.fire('Mohon Maaf', res.message, 'warning'); // Menampilkan alasan jadwal bertabrakan
                }
            } catch (err) {
                Swal.fire('Error', 'Terjadi kesalahan jaringan', 'error');
            } finally {
                btn.innerHTML = 'Ajukan Peminjaman';
                btn.disabled = false;
            }
        }
    </script>
</body>
